name: infrareveal

x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    image: infrareveal-gateway:local
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "host"
    privileged: true
    restart: always
    logging: *bounded-logs
    environment:
      - AP_IFACE=${AP_IFACE:-wlan0}
      - ADMIN_IFACE=${ADMIN_IFACE:-wlan1}
      - ADMIN_WIFI_MAC=${ADMIN_WIFI_MAC:-}
      - INTERNET_IFACE=${INTERNET_IFACE:-eth0}
      - SSID=${SSID:-Infrareveal}
      - DEMO_MODE=${DEMO_MODE:-false}
      - DEMO_RETENTION_MINUTES=${DEMO_RETENTION_MINUTES:-30}
      - DEMO_DOMAIN_CATALOGUE=${DEMO_DOMAIN_CATALOGUE:-true}
      - ADMIN_SSID=${ADMIN_SSID:-Infrareveal-admin}
      - AP_PREFIX=${AP_PREFIX:-10.0.0}
      - ADMIN_PREFIX=${ADMIN_PREFIX:-10.77.0}
      - WIFI_COUNTRY=${WIFI_COUNTRY:-SE}
      - AP_CHANNEL=${AP_CHANNEL:-1}
      - ADMIN_CHANNEL=${ADMIN_CHANNEL:-6}
      - CONNTRACK_SAMPLE_MS=${CONNTRACK_SAMPLE_MS:-1000}
      - ROUTE_ENGINE=${ROUTE_ENGINE:-v2}
      - ROUTE_MAX_TARGETS=${ROUTE_MAX_TARGETS:-20}
      - ROUTE_MAX_ATTEMPTS=${ROUTE_MAX_ATTEMPTS:-40}
      - ROUTE_HOURLY_ATTEMPTS=${ROUTE_HOURLY_ATTEMPTS:-40}
      - ROUTE_MAX_SNAPSHOTS=${ROUTE_MAX_SNAPSHOTS:-100}
      - ROUTE_MAX_BYTES=${ROUTE_MAX_BYTES:-16777216}
      - ROUTE_ASN_DB=${ROUTE_ASN_DB:-/root/geoip/asn.mmdb}
      - PACKET_ACTIVITY_ENABLED=true
      - PACKET_ACTIVITY_BUCKET_MS=50
      - PACKET_ACTIVITY_CHUNK_SECONDS=5
      - PACKET_ACTIVITY_RETENTION_HOURS=24
      - DEBUG_TRACE_ENABLED=${DEBUG_TRACE_ENABLED:-false}
      - DEBUG_TRACE_RING_EVENTS=${DEBUG_TRACE_RING_EVENTS:-20000}
      - DEBUG_TRACE_RETENTION_SECONDS=${DEBUG_TRACE_RETENTION_SECONDS:-30}
      - DEBUG_TRACE_INGRESS_BUFFER=${DEBUG_TRACE_INGRESS_BUFFER:-8192}
      - DEBUG_TRACE_SUBSCRIBER_BUFFER=${DEBUG_TRACE_SUBSCRIBER_BUFFER:-256}
      - DEBUG_TRACE_BATCH_MS=${DEBUG_TRACE_BATCH_MS:-50}
      - DEBUG_TRACE_MAX_BATCH=${DEBUG_TRACE_MAX_BATCH:-200}
      - DEBUG_TRACE_MAX_SUBSCRIBERS=${DEBUG_TRACE_MAX_SUBSCRIBERS:-32}
      - LAB_GATE_ENABLED=${LAB_GATE_ENABLED:-false}
      - LAB_GATE_QUEUE_NUM=${LAB_GATE_QUEUE_NUM:-42}
      - LAB_GATE_STRICT_QUEUE_NUM=${LAB_GATE_STRICT_QUEUE_NUM:-43}
      - LAB_GATE_DNS_QUEUE_NUM=${LAB_GATE_DNS_QUEUE_NUM:-44}
      - LAB_GATE_MAX_PENDING_FLOWS=${LAB_GATE_MAX_PENDING_FLOWS:-128}
      - LAB_GATE_MAX_HELD_PACKETS=${LAB_GATE_MAX_HELD_PACKETS:-768}
      - LAB_GATE_FLOW_TIMEOUT_MS=${LAB_GATE_FLOW_TIMEOUT_MS:-10000}
      - LAB_GATE_ESTABLISHED_TIMEOUT_MS=${LAB_GATE_ESTABLISHED_TIMEOUT_MS:-500}
      - LAB_GATE_DNS_TIMEOUT_MS=${LAB_GATE_DNS_TIMEOUT_MS:-2000}
      - LAB_GATE_DECISION_CACHE_SECONDS=${LAB_GATE_DECISION_CACHE_SECONDS:-120}
      - LAB_GATE_FAIL_OPEN=${LAB_GATE_FAIL_OPEN:-true}
      - LAB_GATE_CONTROL_TOKEN_FILE=${LAB_GATE_CONTROL_TOKEN_FILE:-}
      - LAB_GATE_ALLOWED_ORIGINS=${LAB_GATE_ALLOWED_ORIGINS:-}
    volumes:
      - ${DATA_DIR:-./data}:/root/pb/pb_data
      - ${GEOIP_DIR:-./geoip}:/root/geoip:ro
    healthcheck:
      test: ["CMD", "python3", "/root/scripts/gateway-runtime.py", "health"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 30s
    stop_grace_period: 20s
  dashboard:
    image: infrareveal-dashboard:local
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    network_mode: host
    restart: always
    logging: *bounded-logs
    environment:
      ADMIN_IP: ${ADMIN_PREFIX:-10.77.0}.1
    depends_on:
      proxy:
        # The dashboard entrypoint waits for gateway networking without making
        # compose up fail when the admin USB adapter is absent at startup.
        condition: service_started
  debug-dashboard:
    image: infrareveal-debug-dashboard:local
    profiles: ["debug"]
    build:
      context: .
      dockerfile: debug-dashboard/Dockerfile
    network_mode: host
    restart: always
    logging: *bounded-logs
    environment:
      ADMIN_IP: ${ADMIN_PREFIX:-10.77.0}.1
    depends_on:
      proxy:
        condition: service_started
