name: infrareveal

x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    image: infrareveal-gateway:local
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "host"
    privileged: true
    restart: always
    logging: *bounded-logs
    environment:
      - AP_IFACE=${AP_IFACE:-wlan0}
      - ADMIN_WIFI_ENABLED=${ADMIN_WIFI_ENABLED:-false}
      - DASHBOARD_ON_AP=${DASHBOARD_ON_AP:-true}
      - ADMIN_IFACE=${ADMIN_IFACE:-wlan1}
      - ADMIN_WIFI_MAC=${ADMIN_WIFI_MAC:-}
      - INTERNET_IFACE=${INTERNET_IFACE:-eth0}
      - SSID=${SSID:-Infrareveal}
      - DEMO_MODE=${DEMO_MODE:-false}
      - DEMO_RETENTION_MINUTES=${DEMO_RETENTION_MINUTES:-30}
      - ADMIN_SSID=${ADMIN_SSID:-Infrareveal-admin}
      - AP_PREFIX=${AP_PREFIX:-10.0.0}
      - ADMIN_PREFIX=${ADMIN_PREFIX:-10.77.0}
      - WIFI_COUNTRY=${WIFI_COUNTRY:-SE}
      - AP_CHANNEL=${AP_CHANNEL:-1}
      - ADMIN_CHANNEL=${ADMIN_CHANNEL:-6}
      - CONNTRACK_SAMPLE_MS=${CONNTRACK_SAMPLE_MS:-1000}
      - ROUTE_ENGINE=${ROUTE_ENGINE:-scamper}
      - ROUTE_MAX_TARGETS=${ROUTE_MAX_TARGETS:-20}
      - ROUTE_MAX_ATTEMPTS=${ROUTE_MAX_ATTEMPTS:-40}
      - ROUTE_HOURLY_ATTEMPTS=${ROUTE_HOURLY_ATTEMPTS:-40}
      - ROUTE_MAX_SNAPSHOTS=${ROUTE_MAX_SNAPSHOTS:-100}
      - ROUTE_MAX_BYTES=${ROUTE_MAX_BYTES:-16777216}
      - GEOIP_CITY_DB=${GEOIP_CITY_DB:-/root/geoip/city.mmdb}
      - ROUTE_ASN_DB=${ROUTE_ASN_DB:-/root/geoip/asn.mmdb}
      - PACKET_ACTIVITY_ENABLED=${PACKET_ACTIVITY_ENABLED:-true}
      - TRAFFIC_CHUNK_MS=${TRAFFIC_CHUNK_MS:-5000}
      - TRAFFIC_BUCKET_MS=${TRAFFIC_BUCKET_MS:-50}
      - TRAFFIC_FLUSH_MS=${TRAFFIC_FLUSH_MS:-1000}
      - TRAFFIC_CORRECTION_MS=${TRAFFIC_CORRECTION_MS:-10000}
      - ACTIVITY_QUIET_GAP_MS=${ACTIVITY_QUIET_GAP_MS:-45000}
      - TRAFFIC_MAX_PENDING_CHUNKS=${TRAFFIC_MAX_PENDING_CHUNKS:-16384}
      - PACKET_ACTIVITY_EVENT_QUEUE=${PACKET_ACTIVITY_EVENT_QUEUE:-32768}
    volumes:
      - ${DATA_DIR:-./data}:/root/pb/pb_data
      - ${GEOIP_DIR:-./geoip}:/root/geoip
    healthcheck:
      test: ["CMD", "python3", "/root/scripts/gateway-runtime.py", "health"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 30s
    stop_grace_period: 20s
  dashboard:
    image: infrareveal-dashboard:local
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    network_mode: host
    restart: always
    logging: *bounded-logs
    depends_on:
      proxy:
        # The dashboard entrypoint waits for gateway networking without making
        # compose up fail while gateway networking is starting.
        condition: service_started
