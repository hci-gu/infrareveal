services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "host"
    privileged: true
    restart: always
    environment:
      - AP_IFACE=wlan0
      - INTERNET_IFACE=eth0
      - SSID=Infrareveal
      - PACKET_ACTIVITY_ENABLED=true
      - PACKET_ACTIVITY_BUCKET_MS=50
      - PACKET_ACTIVITY_CHUNK_SECONDS=5
      - PACKET_ACTIVITY_RETENTION_HOURS=24
      - DEBUG_TRACE_ENABLED=${DEBUG_TRACE_ENABLED:-false}
      - DEBUG_TRACE_RING_EVENTS=${DEBUG_TRACE_RING_EVENTS:-20000}
      - DEBUG_TRACE_RETENTION_SECONDS=${DEBUG_TRACE_RETENTION_SECONDS:-30}
      - DEBUG_TRACE_INGRESS_BUFFER=${DEBUG_TRACE_INGRESS_BUFFER:-8192}
      - DEBUG_TRACE_SUBSCRIBER_BUFFER=${DEBUG_TRACE_SUBSCRIBER_BUFFER:-256}
      - DEBUG_TRACE_BATCH_MS=${DEBUG_TRACE_BATCH_MS:-50}
      - DEBUG_TRACE_MAX_BATCH=${DEBUG_TRACE_MAX_BATCH:-200}
      - DEBUG_TRACE_MAX_SUBSCRIBERS=${DEBUG_TRACE_MAX_SUBSCRIBERS:-32}
      - LAB_GATE_ENABLED=${LAB_GATE_ENABLED:-false}
      - LAB_GATE_QUEUE_NUM=${LAB_GATE_QUEUE_NUM:-42}
      - LAB_GATE_STRICT_QUEUE_NUM=${LAB_GATE_STRICT_QUEUE_NUM:-43}
      - LAB_GATE_DNS_QUEUE_NUM=${LAB_GATE_DNS_QUEUE_NUM:-44}
      - LAB_GATE_CLIENT_SUBNET=${LAB_GATE_CLIENT_SUBNET:-10.0.0.0/24}
      - LAB_GATE_MAX_PENDING_FLOWS=${LAB_GATE_MAX_PENDING_FLOWS:-128}
      - LAB_GATE_MAX_HELD_PACKETS=${LAB_GATE_MAX_HELD_PACKETS:-768}
      - LAB_GATE_FLOW_TIMEOUT_MS=${LAB_GATE_FLOW_TIMEOUT_MS:-10000}
      - LAB_GATE_ESTABLISHED_TIMEOUT_MS=${LAB_GATE_ESTABLISHED_TIMEOUT_MS:-500}
      - LAB_GATE_DNS_TIMEOUT_MS=${LAB_GATE_DNS_TIMEOUT_MS:-2000}
      - LAB_GATE_DECISION_CACHE_SECONDS=${LAB_GATE_DECISION_CACHE_SECONDS:-120}
      - LAB_GATE_FAIL_OPEN=${LAB_GATE_FAIL_OPEN:-true}
      - LAB_GATE_CONTROL_TOKEN_FILE=${LAB_GATE_CONTROL_TOKEN_FILE:-}
      - LAB_GATE_ALLOWED_ORIGINS=${LAB_GATE_ALLOWED_ORIGINS:-}
    volumes:
       - ./data:/root/pb/pb_data
    entrypoint: ["/root/entrypoint.sh"]
    # entrypoint: /bin/bash
    tty: true
    ports:
      - "8090:8090"
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: always
    ports:
      - "8080:80"
  debug-dashboard:
    profiles: ["debug"]
    build:
      context: .
      dockerfile: debug-dashboard/Dockerfile
    restart: always
    ports:
      - "8081:80"
