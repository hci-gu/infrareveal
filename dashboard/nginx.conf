server {
  listen ${ADMIN_IP}:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API, PocketBase console and realtime SSE. Preserve the URI.
  location ~ ^/(api/|_/){
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    client_max_body_size 100m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # SPA routes redirect here. Revalidate the entry page after deployments;
  # its fingerprinted asset URLs select the matching application version.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }
}
