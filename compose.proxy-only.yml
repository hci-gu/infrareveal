# Add after docker-compose.yml (and any release override) for one-radio gateways.
# No dashboard starts on a normal `docker compose up`; PocketBase is on LAN :8090.
services:
  proxy:
    environment:
      ADMIN_WIFI_ENABLED: "false"
  dashboard:
    profiles: [admin-ui]
  debug-dashboard:
    profiles: [admin-ui]
